
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f4f7;
    }
    h2 { color: #126b45; }
    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }
    #ujumbe { font-weight: bold; }
  </style>
</head>
<body>
  <h2>GUEST QR SCANNER</h2>
  <p>Elekeza kamera kwenye QR Code ya mgeni.</p>
  <div id="reader"></div>
  <p id="ujumbe">Inatafuta kamera...</p>

  <script>
    const scanner = new Html5Qrcode("reader");
    let imesomwa = false;

    function onScanSuccess(decodedText) {
      if (imesomwa) return;
      imesomwa = true;

      document.getElementById("ujumbe").textContent =
        "QR Code imesomwa. Inathibitisha mgeni...";

      scanner.stop().then(function() {
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\?/.test(decodedText)) {
          document.getElementById("ujumbe").textContent =
            "HITILAFU: QR Code hii si kiungo sahihi cha mfumo.";
          return;
        }

        window.location.replace(decodedText);
      }).catch(function(error) {
        document.getElementById("ujumbe").textContent =
          "HITILAFU: " + error;
      });
    }

    Html5Qrcode.getCameras().then(function(cameras) {
      if (!cameras || cameras.length === 0) {
        throw new Error("Hakuna kamera iliyopatikana.");
      }

      return scanner.start(
        cameras[0].id,
        { fps: 10, qrbox: 250 },
        onScanSuccess
      );
    }).catch(function(error) {
      document.getElementById("ujumbe").textContent =
        "HITILAFU: " + error;
    });
  </script>
</body>
</html>
